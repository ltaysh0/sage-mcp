[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sage-mcp"
version = "0.4.0"
description = "Hybrid semantic search over local knowledge bases and codebases"
requires-python = ">=3.11,<3.12"
dependencies = [
    # LlamaIndex core + integrations
    "llama-index-core>=0.11",
    "llama-index-embeddings-openai>=0.2",
    "llama-index-vector-stores-qdrant>=0.3",
    "llama-index-readers-file>=0.2",
    # Parsers
    "tree-sitter>=0.23",           # AST-aware code splitting
    "tree-sitter-language-pack>=0.2",
    "PyYAML>=6.0",                 # frontmatter parsing
    # Vector store
    "qdrant-client>=1.11",
    "fastembed>=0.4",              # sparse BM25 vectors for hybrid search
    # CLI
    "typer>=0.12",
    "rich>=13.0",                  # pretty output
    # Config + env
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.0",
]

[project.scripts]
sage = "sage_mcp.cli:app"
sage-mcp = "sage_mcp.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
graph = [
    "numpy>=1.24",
    "networkx>=3.0",
]
litellm = ["llama-index-embeddings-litellm"]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["sage_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
