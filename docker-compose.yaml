services:
  qdrant:
    image: qdrant/qdrant:v1.17
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant_data:/qdrant/storage

configs:
  qdrant_config:
    file: /home/ot/.config/sage-mcp/qdrant.yaml

volumes:
  qdrant_data:
